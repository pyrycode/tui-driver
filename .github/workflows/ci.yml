name: ci

# Pure-go checks only. Real-claude e2e tests (`make e2e`) require an
# onboarded claude binary + Anthropic auth + claude state — none of which
# is reasonable to set up on GitHub-hosted runners. Real-claude validation
# happens locally on the operator's Mac (Max-sub-eligible) and per-PR via
# the code-review agent in the dispatcher pipeline (#33), which runs on
# the operator's Mac through pyry agent-run.
#
# Decision recorded 2026-05-19. Replaces the prior `e2e` workflow that
# attempted to run `make e2e` in CI and failed every push to main due to
# the claude-onboarding-in-CI gap. See vault session log
# `📋 Projects/2026-05-16 - tui-driver/Session Logs/2026-05-19.md`
# § "CI failure investigation".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
